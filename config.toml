[serial]
  port = "COM58"
  baud = 115200
  databits = 8
  stopbits = 1
  parity = "N"

[log]
  path = "./logs"

[ui]
  font = "CaskaydiaMono NF"
  fontsize = 14
  timestamp = false
  shell = true
  scrollback = 1000000

[highlight]
  groups = ["audio:#bfd200", "volume:#f16000", "new_wear:#00ff00", ">>>:#ff36ab", "<<<:#ff36ab", "timeout:#ff006e", "period:#4cc9f0", "decode failed:#f51924", "WakeWord detected:#55e042", "active:#66ed2c", "inactive:#f5666d"]

[theme]
  name = "Monokai"
  background = "#272822"
  foreground = "#f8f8f2"
  cursor = "#f8f8f0"
  black = "#272822"
  red = "#f92672"
  green = "#a6e22e"
  yellow = "#f4bf75"
  blue = "#66d9ef"
  magenta = "#ae81ff"
  cyan = "#a1efe4"
  white = "#f8f8f2"
  brightblack = "#75715e"
  brightred = "#fd971f"
  brightgreen = "#a6e22e"
  brightyellow = "#e6db74"
  brightblue = "#66d9ef"
  brightmagenta = "#ae81ff"
  brightcyan = "#a1efe4"
  brightwhite = "#f9f8f5"

[[quick_commands]]
  name = "p2g_test_48k_2ch"
  data = "p2g_test start pcm 1000 48000 2"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_test_opus"
  data = "p2g_test start opus 1000"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_test_16k_1ch"
  data = "p2g_test start pcm 1000 16000 1"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_test stop"
  data = "p2g_test stop"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_start"
  data = "audio_policy start 13"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_stop"
  data = "audio_policy stop 13"
  suffix = "\n"
