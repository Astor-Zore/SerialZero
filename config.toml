[serial]
  port = "COM58"
  baud = 115200
  databits = 8
  stopbits = 1
  parity = "N"

[log]
  path = "./logs"

[ui]
  font = "CaskaydiaMono NF"
  fontsize = 14
  timestamp = false
  shell = true
  scrollback = 1000000

[highlight]
  groups = ["audio:#bfd200", "volume:#f16000", "new_wear:#00ff00", ">>>:#ff36ab", "<<<:#ff36ab", "timeout:#ff006e", "period:#4cc9f0", "decode failed:#f51924", "WakeWord detected:#55e042", "active:#66ed2c", "inactive:#f5666d"]

[theme]
  name = "Dracula"
  background = "#282a36"
  foreground = "#f8f8f2"
  cursor = "#f8f8f2"
  black = "#21222c"
  red = "#ff5555"
  green = "#50fa7b"
  yellow = "#f1fa8c"
  blue = "#bd93f9"
  magenta = "#ff79c6"
  cyan = "#8be9fd"
  white = "#f8f8f2"
  brightblack = "#6272a4"
  brightred = "#ff6e6e"
  brightgreen = "#69ff94"
  brightyellow = "#ffffa5"
  brightblue = "#d6acff"
  brightmagenta = "#ff92df"
  brightcyan = "#a4ffff"
  brightwhite = "#ffffff"

[[quick_commands]]
  name = "p2g_test_48k_2ch"
  data = "p2g_test start pcm 1000 48000 2"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_test_opus"
  data = "p2g_test start opus 1000"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_test_16k_1ch"
  data = "p2g_test start pcm 1000 16000 1"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_test stop"
  data = "p2g_test stop"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_start"
  data = "audio_policy start 13"
  suffix = "\n"

[[quick_commands]]
  name = "p2g_stop"
  data = "audio_policy stop 13"
  suffix = "\n"
